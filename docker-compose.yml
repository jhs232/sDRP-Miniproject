services:
  DB:
    image: postgres:16
    container_name: fklub_postgres
    environment:
      POSTGRES_USER: fklub_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: fklub_bi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  
  saiku:
    image: ghcr.io/spiculedata/saiku:latest
    container_name: fklub_saiku
    environment:
      - SAIKU_ALLOW_DEFAULT_ADMIN=true
    ports:
      - "127.0.0.1:8080:8080"
    # Maps a local folder so you can inject your Mondrian XML schema files
    volumes:
      - ./olap-schemas:/opt/saiku/tomcat/webapps/saiku/WEB-INF/classes/schemas
    depends_on:
      - DB

volumes:
  pg_data:
